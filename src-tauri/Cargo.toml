[package]
name = "sotto"
version = "0.1.0"
description = "Open-source real-time AI meeting & interview copilot"
authors = ["Sotto contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sotto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
anyhow = "1.0.104"
base64 = "0.23.1"
futures-util = "0.3.34"
xcap = "0.9.8"
image = "0.25.10"
tokio = { version = "1.54.1", features = ["sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-store = "2.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "native-tls", "http2", "charset"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
